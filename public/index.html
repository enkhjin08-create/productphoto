<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio — Product Photoshoot Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1f1d1b;
    --panel:#2a2724;
    --card:#faf7f2;
    --ink:#faf7f2;
    --ink-dim:#a89f93;
    --line:rgba(250,247,242,0.12);
    --accent:#8b4b5c;
    --accent-soft:rgba(139,75,92,0.18);
    --radius:14px;
    --transition: all .25s cubic-bezier(.4,0,.2,1);
  }
  [data-brand="zuvhuntuund"]{ --accent:#8b4b5c; --accent-soft:rgba(139,75,92,0.18); }
  [data-brand="meowie"]{ --accent:#e8873a; --accent-soft:rgba(232,135,58,0.18); }
  [data-brand="cutecups"]{ --accent:#a97bc9; --accent-soft:rgba(169,123,201,0.18); }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:40px 24px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:36px;
    flex-wrap:wrap;
    gap:12px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:34px;
    letter-spacing:-0.01em;
    margin-top:4px;
  }
  .lock-screen{
    max-width:340px;
    margin:120px auto;
    text-align:center;
  }
  .lock-screen input{
    width:100%;
    margin-top:20px;
    padding:14px 16px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:18px;
    letter-spacing:.3em;
    text-align:center;
  }
  .lock-screen button{
    margin-top:14px;
    width:100%;
  }
  .grid{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:28px;
  }
  @media (max-width:820px){
    .grid{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
  }
  .field{
    margin-bottom:22px;
  }
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:10px;
  }
  .brand-row{
    display:flex;
    gap:8px;
  }
  .brand-btn{
    flex:1;
    padding:10px 8px;
    border-radius:9px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    font-size:12.5px;
    font-family:'Inter', sans-serif;
    font-weight:500;
    cursor:pointer;
    transition:var(--transition);
  }
  .brand-btn.active{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--ink);
  }
  select{
    width:100%;
    padding:12px 14px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14px;
    appearance:none;
    cursor:pointer;
  }
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:11px;
    padding:28px 16px;
    text-align:center;
    cursor:pointer;
    transition:var(--transition);
    position:relative;
    overflow:hidden;
  }
  .dropzone:hover{ border-color:var(--accent); }
  .dropzone img{
    max-width:100%;
    max-height:160px;
    border-radius:6px;
  }
  .dropzone p{
    color:var(--ink-dim);
    font-size:13px;
  }
  .dropzone input{ display:none; }
  textarea{
    width:100%;
    min-height:70px;
    padding:12px 14px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    resize:vertical;
  }
  button.primary{
    width:100%;
    padding:15px;
    border-radius:9px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    transition:var(--transition);
  }
  button.primary:hover{ filter:brightness(1.08); }
  button.primary:disabled{
    opacity:.45;
    cursor:not-allowed;
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:520px;
    border-radius:var(--radius);
    border:1px solid var(--accent);
    box-shadow:0 0 0 1px var(--accent-soft), 0 30px 60px -30px rgba(0,0,0,0.5);
    background:
      radial-gradient(ellipse at top, var(--accent-soft), transparent 60%),
      var(--card);
    position:relative;
    overflow:hidden;
    transition:var(--transition);
  }
  .stage-label{
    position:absolute;
    top:16px;
    left:18px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:rgba(31,29,27,0.45);
  }
  .stage img{
    max-width:88%;
    max-height:440px;
    border-radius:8px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.35);
  }
  .stage-empty{
    color:rgba(31,29,27,0.35);
    font-family:'Fraunces', serif;
    font-size:18px;
    text-align:center;
    padding:0 40px;
  }
  .stage-actions{
    position:absolute;
    bottom:18px;
    right:18px;
    display:flex;
    gap:8px;
  }
  .stage-actions a, .stage-actions button{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.05em;
    padding:8px 12px;
    border-radius:7px;
    border:1px solid rgba(31,29,27,0.15);
    background:rgba(255,255,255,0.6);
    color:#1f1d1b;
    text-decoration:none;
    cursor:pointer;
  }
  .spinner{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2.5px solid rgba(31,29,27,0.15);
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .edit-panel{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .edit-panel input[type="text"]{
    flex:1;
    padding:12px 14px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:13.5px;
  }
  .edit-panel input[type="text"]::placeholder{
    color:var(--ink-dim);
  }
  button.secondary{
    padding:0 18px;
    border-radius:9px;
    border:1px solid var(--accent);
    background:transparent;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
    transition:var(--transition);
  }
  button.secondary:hover{ background:var(--accent-soft); }
  button.secondary:disabled{
    opacity:.45;
    cursor:not-allowed;
  }
  .gallery{
    margin-top:28px;
  }
  .gallery h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:18px;
    margin-bottom:14px;
    color:var(--ink-dim);
  }
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
    gap:10px;
  }
  .gallery-grid img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--line);
    cursor:pointer;
  }
  .error-msg{
    margin-top:14px;
    font-size:12.5px;
    color:#e07a6f;
    font-family:'JetBrains Mono', monospace;
  }
  .ref-thumbs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .ref-thumb{
    position:relative;
    width:56px;
    height:56px;
    border-radius:7px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .ref-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .ref-thumb button{
    position:absolute;
    top:2px;
    right:2px;
    width:16px;
    height:16px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,0.65);
    color:#fff;
    font-size:10px;
    line-height:16px;
    text-align:center;
    cursor:pointer;
    padding:0;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="eyebrow">Studio · Private</div>
  <h1 style="font-size:24px;">Тавтай морил</h1>
  <input type="password" id="pinInput" placeholder="• • • •" maxlength="8" inputmode="numeric">
  <button class="primary" id="pinSubmit" style="margin-top:14px;">Нэвтрэх</button>
  <div class="error-msg hidden" id="pinError">Буруу PIN</div>
</div>

<div class="wrap hidden" id="mainApp" data-brand="zuvhuntuund">
  <header>
    <div>
      <div class="eyebrow">Studio · Хувийн хэрэглээ</div>
      <h1>Product Photoshoot Generator</h1>
    </div>
  </header>

  <div class="grid">
    <!-- Controls -->
    <div class="panel">
      <div class="field">
        <label>Brand</label>
        <div class="brand-row">
          <button class="brand-btn active" data-brand-btn="zuvhuntuund">ZuvkhunTuund</button>
          <button class="brand-btn" data-brand-btn="meowie">Meowie</button>
          <button class="brand-btn" data-brand-btn="cutecups">CuteCups</button>
        </div>
      </div>

      <div class="field">
        <label>Зураг авалтын төрөл</label>
        <div class="brand-row">
          <button class="brand-btn active" data-shoot-btn="lifestyle">Lifestyle</button>
          <button class="brand-btn" data-shoot-btn="flatlay">Flat Lay</button>
          <button class="brand-btn" data-shoot-btn="beautifier">Beautifier</button>
          <button class="brand-btn" data-shoot-btn="model">Virtual Model</button>
          <button class="brand-btn" data-shoot-btn="campaign">Campaign (олон orchин)</button>
        </div>
      </div>

      <div class="field">
        <label>Бүтээгдэхүүний зураг</label>
        <div class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept="image/*">
          <div id="dropzoneContent">
            <p>Энд дарж зураг сонгох<br>эсвэл чирж оруулах</p>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Reference зургууд (сонголтоор, олноор)</label>
        <div class="dropzone" id="refDropzone">
          <input type="file" id="refFileInput" accept="image/*" multiple>
          <div id="refDropzoneContent">
            <p>Дэвсгэр/тайлбар зорилготой<br>жишээ зургууд нэмэх</p>
          </div>
        </div>
        <div class="ref-thumbs" id="refThumbs"></div>
      </div>

      <div class="field">
        <label id="descriptionLabel">Тайлбар (сонголтоор)</label>
        <textarea id="descriptionPrompt" placeholder="жишээ: reference зурган дээрхтэй төстэй мод дэвсгэртэй, өглөөний зөөлөн гэрэлтэй, дулаан аяга... (хоосон орхивол ерөнхий professional photoshoot байдлаар үүснэ)" style="min-height:110px;"></textarea>
      </div>

      <button class="primary" id="generateBtn" disabled>Зураг үүсгэх</button>
      <div class="error-msg hidden" id="genError"></div>
    </div>

    <!-- Stage -->
    <div>
      <div class="stage" id="stage">
        <span class="stage-label" id="stageLabel">ZuvkhunTuund</span>
        <div class="stage-empty" id="stageEmpty">Бүтээгдэхүүнийхээ зургийг<br>оруулаад эхлүүлнэ үү</div>
      </div>

      <div class="edit-panel hidden" id="editPanel">
        <input type="text" id="editPrompt" placeholder="Юу засах вэ? жишээ: дэвсгэрийг илүү гэрэлтэй болго, аяга арай баруун тийш шилжүүл...">
        <button class="secondary" id="editBtn">Дахин үүсгэх</button>
      </div>

      <div class="gallery">
        <h2>Сүүлд үүсгэсэн</h2>
        <div class="gallery-grid" id="galleryGrid">
          <!-- Firestore-с ачаалагдана -->
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- CONFIG ---------- */
// TODO: доорх PIN-г солиорой (client-side түгжээ, зөвхөн хялбар хамгаалалт)
const APP_PIN = "0000";

/* ---------- PIN GATE ---------- */
const lockScreen = document.getElementById('lockScreen');
const mainApp = document.getElementById('mainApp');
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');

document.getElementById('pinSubmit').onclick = tryUnlock;
pinInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });

function tryUnlock(){
  if(pinInput.value === APP_PIN){
    lockScreen.classList.add('hidden');
    mainApp.classList.remove('hidden');
    loadGallery();
  } else {
    pinError.classList.remove('hidden');
  }
}

/* ---------- BRAND SWITCH ---------- */
let currentBrand = 'zuvhuntuund';
const brandButtons = document.querySelectorAll('[data-brand-btn]');
const stageLabel = document.getElementById('stageLabel');
const BRAND_NAMES = { zuvhuntuund: "ZuvkhunTuund", meowie: "Meowie", cutecups: "CuteCups" };

brandButtons.forEach(btn => {
  btn.onclick = () => {
    brandButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentBrand = btn.dataset.brandBtn;
    mainApp.dataset.brand = currentBrand;
    stageLabel.textContent = BRAND_NAMES[currentBrand];
    loadGallery();
  };
});

/* ---------- SHOOT TYPE (Lifestyle / Flat Lay / Beautifier / Virtual Model) ---------- */
let currentShootType = 'lifestyle';
const shootButtons = document.querySelectorAll('[data-shoot-btn]');
const descriptionLabel = document.getElementById('descriptionLabel');
const descriptionPromptEl = document.getElementById('descriptionPrompt');
const DEFAULT_DESC_PLACEHOLDER = descriptionPromptEl.placeholder;
const CAMPAIGN_DESC_PLACEHOLDER = 'Мөр бүрд өөр orchин бичнэ үү (хоосон орхивол brand-д тохирсон 5 стандарт orchин автоматаар ашиглагдана). Жишээ:\nдулаан модон тавиур дээр, зөөлөн орой цагийн гэрэлтэй\nцэвэр студийн крем өнгийн дэвсгэр, сүүдэртэй\nгадаа picnic blanket дээр, нар тусаж буй';

shootButtons.forEach(btn => {
  btn.onclick = () => {
    shootButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentShootType = btn.dataset.shootBtn;
    if(currentShootType === 'campaign'){
      descriptionLabel.textContent = 'Orchин жагсаалт (сонголтоор, мөр тус бүр = 1 зураг)';
      descriptionPromptEl.placeholder = CAMPAIGN_DESC_PLACEHOLDER;
    } else {
      descriptionLabel.textContent = 'Тайлбар (сонголтоор)';
      descriptionPromptEl.placeholder = DEFAULT_DESC_PLACEHOLDER;
    }
  };
});

/* ---------- FILE UPLOAD ---------- */
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const dropzoneContent = document.getElementById('dropzoneContent');
const generateBtn = document.getElementById('generateBtn');
let uploadedBase64 = null;
let uploadedMime = null;

dropzone.onclick = () => fileInput.click();
fileInput.onchange = e => handleFile(e.target.files[0]);
dropzone.ondragover = e => e.preventDefault();
dropzone.ondrop = e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };

/* ---------- Зураг resize/compress хийх (Gemini рүү явуулахын өмнө) ---------- */
// Том хэмжээтэй утасны зурагнууд Netlify function-ий хугацаа хэтрүүлэхээс сэргийлж
// 1400px-ээс хэтрэхгүй, JPEG 0.85 чанараар шахна.
function resizeImage(file, maxDimension = 1400, quality = 0.85){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDimension || height > maxDimension){
        if(width > height){
          height = Math.round(height * (maxDimension / width));
          width = maxDimension;
        } else {
          width = Math.round(width * (maxDimension / height));
          height = maxDimension;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function handleFile(file){
  if(!file) return;
  resizeImage(file).then(({ dataUrl, base64, mimeType }) => {
    uploadedBase64 = base64;
    uploadedMime = mimeType;
    dropzoneContent.innerHTML = `<img src="${dataUrl}" alt="preview">`;
    generateBtn.disabled = false;
  }).catch(() => {
    genError.textContent = 'Зураг уншихад алдаа гарлаа, дахин оролдоно уу.';
    genError.classList.remove('hidden');
  });
}

/* ---------- REFERENCE IMAGES (олноор) ---------- */
const refDropzone = document.getElementById('refDropzone');
const refFileInput = document.getElementById('refFileInput');
const refThumbs = document.getElementById('refThumbs');
let referenceImages = []; // { base64, mimeType }

refDropzone.onclick = () => refFileInput.click();
refFileInput.onchange = e => { addReferenceFiles(e.target.files); refFileInput.value = ''; };
refDropzone.ondragover = e => e.preventDefault();
refDropzone.ondrop = e => { e.preventDefault(); addReferenceFiles(e.dataTransfer.files); };

function addReferenceFiles(fileList){
  Array.from(fileList).forEach(file => {
    if(!file.type.startsWith('image/')) return;
    resizeImage(file, 1000, 0.8).then(({ dataUrl, base64, mimeType }) => {
      referenceImages.push({ base64, mimeType, previewUrl: dataUrl });
      renderRefThumbs();
    });
  });
}

function renderRefThumbs(){
  refThumbs.innerHTML = '';
  referenceImages.forEach((ref, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'ref-thumb';
    thumb.innerHTML = `<img src="${ref.previewUrl}"><button data-idx="${idx}">&times;</button>`;
    thumb.querySelector('button').onclick = () => {
      referenceImages.splice(idx, 1);
      renderRefThumbs();
    };
    refThumbs.appendChild(thumb);
  });
}

/* ---------- requestId-аар generate-background.js-ийн явцыг polling хийх ---------- */
// status.js endpoint-г тогтмол шалгаж, "done" эсвэл "error" болтол хүлээнэ.
// onTick callback-аар товч дээрх текстийг шинэчилж болно.
async function pollStatus(requestId, maxWaitMs = 180000, intervalMs = 2000, onTick){
  const startedAt = Date.now();
  while(Date.now() - startedAt < maxWaitMs){
    await new Promise(r => setTimeout(r, intervalMs));
    if(onTick) onTick(Math.round((Date.now() - startedAt) / 1000));
    try {
      const res = await fetch('/.netlify/functions/status?id=' + requestId);
      if(res.ok){
        const data = await res.json();
        if(data.status === 'done' || data.status === 'error') return data;
        // status === 'pending' бол polling-ыг үргэлжлүүлнэ
      }
    } catch(e){
      // сүлжээ түр тасарсан ч polling-ыг үргэлжлүүлнэ, дараагийн tick дээр дахин оролдоно
    }
  }
  return null;
}

/* ---------- GENERATE ---------- */
const stage = document.getElementById('stage');
const stageEmpty = document.getElementById('stageEmpty');
const genError = document.getElementById('genError');
const editPanel = document.getElementById('editPanel');
const editPrompt = document.getElementById('editPrompt');
const editBtn = document.getElementById('editBtn');

let lastResultUrl = null; // хамгийн сүүлд амжилттай үүссэн зургийн GitHub URL — засварлахад ашиглана

// Нийтлэг generate+polling logic — эхний generate болон дараагийн "засварлах"
// (regenerate) хоёулаа энийг дуудна.
async function runGeneration({ productImageUrl, referenceImageUrls, description, btnEl, defaultBtnText, mode, shootType }){
  genError.classList.add('hidden');
  btnEl.disabled = true;

  const requestId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);

  try {
    btnEl.textContent = 'Үүсгэж байна...';
    fetch('/.netlify/functions/generate-background', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requestId,
        brand: currentBrand,
        description,
        productImageUrl,
        referenceImageUrls,
        mode,
        shootType
      })
    }).catch(() => {
      // Энэ fetch өөрөө network дээр амжилтгүй болсон ч — доорх polling
      // үргэлжлэх тул энд алдаа шидэхгүй, зөвхөн үл тоомсорлоно.
    });

    const result = await pollStatus(requestId, 180000, 2000, (elapsedSec) => {
      btnEl.textContent = `Үүсгэж байна... (${elapsedSec}с)`;
    });

    if(!result){
      throw new Error('180 секундэд хариу ирсэнгүй. GitHub repo-гоо шалгаарай — зураг үүссэн ч энэ хуудас руу мэдээлэл хоцорсон байж магадгүй.');
    }

    if(result.status === 'error'){
      throw new Error(result.errorMessage || 'Generate явцад алдаа гарлаа');
    }

    document.getElementById('genSpinner')?.remove();
    stageEmpty.classList.add('hidden');
    stage.querySelectorAll('img, .stage-actions, .campaign-grid').forEach(el => el.remove());

    if(Array.isArray(result.imageUrls) && result.imageUrls.length > 1){
      // Campaign горим: хэд хэдэн orchин зэрэг гарсан тул grid байдлаар харуулна
      const grid = document.createElement('div');
      grid.className = 'campaign-grid';
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;';
      result.imageUrls.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.style.cssText = 'width:100%;border-radius:10px;cursor:pointer;display:block;';
        img.title = 'Дарж шинэ tab дээр томоор харах';
        img.onclick = () => window.open(url, '_blank');
        grid.appendChild(img);
      });
      stage.appendChild(grid);
      lastResultUrl = result.imageUrls[0];

      const actions = document.createElement('div');
      actions.className = 'stage-actions';
      actions.innerHTML = `<span style="opacity:.7;font-size:13px;">${result.imageUrls.length} зураг үүслээ — дарж татаж/харж болно</span>`;
      stage.appendChild(actions);
    } else {
      const resultImg = document.createElement('img');
      resultImg.src = result.imageUrl;
      stage.appendChild(resultImg);

      const actions = document.createElement('div');
      actions.className = 'stage-actions';
      actions.innerHTML = `
        <a href="${result.imageUrl}" download target="_blank">Татах</a>
        <button onclick="navigator.clipboard.writeText('${result.imageUrl}')">Линк хуулах</button>
      `;
      stage.appendChild(actions);

      lastResultUrl = result.imageUrl;
    }

    editPanel.classList.remove('hidden');
    editPrompt.value = '';

    loadGallery();
  } catch(err){
    document.getElementById('genSpinner')?.remove();
    if(!lastResultUrl){
      stageEmpty.classList.remove('hidden');
    }
    genError.textContent = err.message;
    genError.classList.remove('hidden');
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = defaultBtnText;
  }
}

generateBtn.onclick = async () => {
  genError.classList.add('hidden');

  const description = document.getElementById('descriptionPrompt').value.trim();

  generateBtn.disabled = true;
  generateBtn.textContent = 'Эхлүүлж байна...';
  stageEmpty.classList.add('hidden');
  editPanel.classList.add('hidden');
  lastResultUrl = null;
  stage.querySelectorAll('img, .stage-actions').forEach(el => el.remove());

  const spinner = document.createElement('div');
  spinner.className = 'spinner';
  spinner.id = 'genSpinner';
  stage.appendChild(spinner);

  // Оролтын зургуудад зориулсан requestId — upload-input.js энэ ID-аар GitHub дээр
  // түр хавтас (uploads/<requestId>/) үүсгэнэ.
  const uploadRequestId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);

  try {
    // 1. Оролтын зургуудыг эхлээд synchronous function-оор GitHub руу upload хийнэ
    // (Gemini орохгүй тул хурдан, 6MB хүртэл payload зөвшөөрдөг тул зураг багтана).
    generateBtn.textContent = 'Зураг байршуулж байна...';
    const uploadRes = await fetch('/.netlify/functions/upload-input', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requestId: uploadRequestId,
        image: uploadedBase64,
        mimeType: uploadedMime,
        references: referenceImages.map(r => ({ base64: r.base64, mimeType: r.mimeType }))
      })
    });

    if(!uploadRes.ok){
      const errText = await uploadRes.text();
      throw new Error('Зураг байршуулахад алдаа гарлаа: ' + (errText || uploadRes.status));
    }

    const { productUrl, referenceUrls } = await uploadRes.json();

    // 2. Background function-г зөвхөн жижиг payload (URL-ууд)-тойгоор дуудна
    await runGeneration({
      productImageUrl: productUrl,
      referenceImageUrls: referenceUrls,
      description,
      btnEl: generateBtn,
      defaultBtnText: 'Зураг үүсгэх',
      mode: 'compose',
      shootType: currentShootType
    });
  } catch(err){
    document.getElementById('genSpinner')?.remove();
    stageEmpty.classList.remove('hidden');
    genError.textContent = err.message;
    genError.classList.remove('hidden');
    generateBtn.disabled = false;
    generateBtn.textContent = 'Зураг үүсгэх';
  }
};

/* ---------- ЗАСВАРЛАХ (regenerate) ---------- */
// Хамгийн сүүлд гарсан зургийг үндэс болгож, зөвхөн засварын тайлбарыг нэмж
// дахин generate хийнэ — шинээр зураг upload хийх шаардлагагүй (аль хэдийн
// GitHub дээр байгаа тул шууд URL-ыг нь дамжуулна).
editBtn.onclick = async () => {
  const editText = editPrompt.value.trim();
  if(!editText){
    genError.textContent = 'Юу засахыг хүсэж байгаагаа бичээрэй.';
    genError.classList.remove('hidden');
    return;
  }
  if(!lastResultUrl) return;

  const spinner = document.createElement('div');
  spinner.className = 'spinner';
  spinner.id = 'genSpinner';
  stage.appendChild(spinner);

  await runGeneration({
    productImageUrl: lastResultUrl,
    referenceImageUrls: [],
    description: editText,
    btnEl: editBtn,
    defaultBtnText: 'Дахин үүсгэх',
    mode: 'edit'
  });
};

/* ---------- GALLERY (Firestore-с сүүлийн үүсгэсэн зургууд) ---------- */
async function loadGallery(){
  try {
    const res = await fetch('/.netlify/functions/history?brand=' + currentBrand);
    if(!res.ok) return;
    const items = await res.json();
    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = '';
    items.slice(0, 12).forEach(item => {
      const img = document.createElement('img');
      img.src = item.imageUrl;
      img.title = item.description || '';
      grid.appendChild(img);
    });
  } catch(e){
    // gallery ачаалахгүй байгаа нь generate хийхэд саад болохгүй тул чимээгүй өнгөрөөнэ
  }
}
</script>
